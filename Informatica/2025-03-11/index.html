<!-- Sito per gioco con i dadi      -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <!-- Imposta il set di caratteri per il documento come UTF-8 -->
        <meta charset="utf-8">
        <!-- Rende la pagina reattiva su dispositivi mobili -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Titolo della pagina, visibile sulla barra del browser -->
        <title>Gioco di scommesse</title>
        <!-- Inclusione del CSS di Bootstrap per la stilizzazione -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- Inclusione delle icone di Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- Script JavaScript che gestisce la logica del gioco -->
        <script src="./index.js" defer></script>
    </head>

    <body>
        <div class="d-flex align-items-center py-4">
            <main class="m-auto">
                <!-- Titolo principale del gioco -->
                <h1>Gioco di scommesse</h1>
                <!-- Visualizzazione del saldo disponibile -->
                <p class="pb-2">Hai <b id="saldo"></b> di saldo</p>
                <!-- Form per inviare i dati della scommessa, la funzione 'gioca()' sarà invocata al submit -->
                <form action="javascript:gioca()">
                    <div class="form-floating my-3">
                        <!-- Campo per inserire l'importo della scommessa -->
                        <input type="number" class="form-control" id="scommessa" placeholder="10">
                        <!-- Etichetta per il campo scommessa -->
                        <label for="scommessa">Scommessa</label>
                    </div>
                    <div class="form-floating">
                        <!-- Campo per inserire il numero da indovinare, tra 1 e 12 -->
                        <input type="number" max="12" min="1" class="form-control" id="numero" placeholder="3">
                        <!-- Etichetta per il campo numero -->
                        <label for="numero">Numero da indovinare</label>
                    </div>

                    <div class="w-auto d-flex justify-content-center my-3">
                        <!-- Bottone per inviare il form e fare la scommessa -->
                        <input type="submit" class="btn btn-primary me-2">
                        <!-- Bottone nascosto che appare per ricominciare la partita -->
                        <input type="submit" formaction="javascript:ricomincia()" id="ricomincia" hidden class="btn btn-danger ms-2"  value="Ricomincia">
                    </div>
                </form>
            </main>
        </div>
        <div class="p-4">
            <div class="d-flex justify-content-center">
                <!-- Titolo per la sezione dei dadi -->
                <h1 class="me-3">Dadi</h1>
                <!-- Icona per i dadi con valore da 1 a 6 -->
                <h1 class="bi bi-dice-1 mx-2"></h1>
                <h1 class="bi bi-dice-2 mx-2"></h1>
                <h1 class="bi bi-dice-3 mx-2"></h1>
                <h1 class="bi bi-dice-4 mx-2"></h1>
                <h1 class="bi bi-dice-5 mx-2"></h1>
                <h1 class="bi bi-dice-6 mx-2"></h1>
            </div>
            <div id="giocata" class="d-flex justify-content-center mt-3">
                <!-- Visualizzazione del risultato della giocata -->
                <h1 class="me-3">Giocata</h1>
            </div>
        </div>
    </body>
</html>
