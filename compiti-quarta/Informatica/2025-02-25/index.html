<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gioco di scommesse</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>

    <body class="d-flex align-items-center py-4">
        <main class="m-auto">
            <h1 class="py-5">Gioco di scommesse</h1>
            <form action="javascript:gioca()">
                <div class="form-floating">
                    <input type="number" class="form-control" id="scommessa" placeholder="10">
                    <label for="scommessa">Scommessa</label>
                </div>
                <br>
                <div class="form-floating">
                    <input type="number" max="12" min="1" class="form-control" id="numero" placeholder="3">
                    <label for="numero">Numero da indovinare</label>
                </div>
                <br>
                <div class="w-25">
                    <input type="submit" class="btn btn-primary">
                </div>
            </form>
        </main>
        <script>
            window.onload = function (){
                const saldo = window.localStorage["saldo"];
                if(saldo === undefined || parseInt(saldo) === undefined){
                    window.localStorage["saldo"] = 50;
                }
            };
            function gioca(){
                const scommessa = document.getElementById("scommessa");
                const numero = document.getElementById("numero");
                
                const s = parseInt(scommessa.value);
                const n = parseInt(numero.value);

                if (n < 1 || n > 12){
                    alert("Il numero inserito non è nel range [1; 12]");
                    return;
                }
            }
        </script>
    </body>
</html>
