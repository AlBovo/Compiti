<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Set the character encoding for the document -->
        <meta charset="utf-8">
        
        <!-- Set the viewport settings for responsive design -->
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        
        <!-- Title of the page that appears in the browser tab -->
        <title>JQuery Login | Home</title>
        
        <!-- Meta description for the page (used for SEO) -->
        <meta name="description" content="Una pagina per la validazione di un login in jquery">
        
        <!-- Link to Bootstrap CSS for styling the page -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
        <!-- Link to the jQuery library (necessary for interactive elements) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
            integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
            crossorigin="anonymous" referrerpolicy="no-referrer">
        </script>
        
        <!-- Link to the custom CSS file for additional styles (if needed) -->
        <link href="./static/style.css" rel="stylesheet">
        
        <!-- Link to the custom JavaScript file for interactivity and form validation (async and defer for non-blocking loading) -->
        <script src="./static/script.js" async defer></script>
    </head>

    <body class="text-center">
        <!-- Form for user login, using Bootstrap classes for layout and styling -->
        <form class="w-50" action="javascript:check()">
            <!-- Main title of the form (Login instructions) -->
            <h1 class="h3 mb-3 font-weight-normal">Enter your credential</h1>
            
            <!-- Row for name, surname, and birthdate input fields -->
            <div class="row d-flex justify-content-center">
                <!-- Name input field with Bootstrap styling -->
                <input type="text" id="name" class="form-control col m-3" placeholder="Name" required="">
                
                <!-- Surname input field with Bootstrap styling -->
                <input type="text" id="surname" class="form-control col m-3" placeholder="Surname" required="">
                
                <!-- Birthdate input field with Bootstrap styling -->
                <input type="date" id="birthdate" class="form-control col m-3" title="Birthdate" required="">
            </div>
            
            <!-- Row for the username input field -->
            <div class="row d-flex justify-content-center">
                <!-- Username input field with Bootstrap styling -->
                <input type="text" id="username" class="form-control col m-3" placeholder="Username" required="">
            </div>
            
            <!-- Row for email and password input fields -->
            <div class="row d-flex justify-content-center">
                <!-- Email input field with Bootstrap styling -->
                <input type="email" id="email" class="form-control col m-3" placeholder="Email address" required="">
                
                <!-- Password input field with Bootstrap styling -->
                <input type="password" id="password" class="form-control col m-3" placeholder="Password" required="">
            </div>
            
            <!-- Submit button to submit the form (Bootstrap button style) -->
            <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
        </form>
    </body>
</html>
